# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV["DATABASE_PORT"] %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  primary:
    <<: *default
    database: <%= ENV["DATABASE_DB"] %>
  analytics:
    <<: *default
    database: <%= ENV["ANALYTICS_DB"] %>
    host: <%= ENV.fetch("ANALYTICS_DATABASE_HOST", "localhost") %>
    port: <%= ENV.fetch("ANALYTICS_DATABASE_PORT", 5436) %>
    migrations_paths: db/analytics_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: <%= ENV["DATABASE_DB"] %>
  analytics:
    <<: *default
    database: <%= ENV["ANALYTICS_DB"] %>_test
    host: <%= ENV.fetch("ANALYTICS_DATABASE_HOST", "localhost") %>
    port: <%= ENV.fetch("ANALYTICS_DATABASE_PORT", 5436) %>
    migrations_paths: db/analytics_migrate


# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: <%= ENV["DATABASE_DB"] %>
    url: <%= ENV["DATABASE_URL"] %>
  analytics:
    <<: *default
    database: chat_production_analytics
    url: <%= ENV["ANALYTICS_DATABASE_URL"] %>
    migrations_paths: db/analytics_migrate
  cache:
    <<: *default
    database: chat_production_cache
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: chat_production_queue
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: chat_production_cable
    url: <%= ENV["CABLE_DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
